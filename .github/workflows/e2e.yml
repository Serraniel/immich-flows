name: E2E

on:
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "e2e/**"
      - ".github/workflows/e2e.yml"
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Anonymous ghcr.io pulls from runners hit toomanyrequests.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull images
        working-directory: e2e
        # Registries rate-limit bursts (toomanyrequests).
        run: for i in 1 2 3 4 5; do docker compose pull --ignore-buildable && exit 0; sleep $((i * 10)); done; exit 1
      - name: Start stack
        working-directory: e2e
        run: docker compose up -d --build --wait
      - run: go test -tags e2e -count=1 -v ./e2e/
      - name: Logs
        if: failure()
        working-directory: e2e
        run: docker compose logs
      - name: Stop stack
        if: always()
        working-directory: e2e
        run: docker compose down -v
