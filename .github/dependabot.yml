# Updates to shipped code (Go modules, UI runtime packages, base images) use fix(deps) so that
# release-please releases them; tooling-only updates use chore/ci and do not. Applies to security updates too.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix(deps)"
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    ignore:
      # TypeScript 7 is not yet supported by svelte-check and typescript-eslint.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    # "dependencies" are bundled into the UI, "devDependencies" are build and test tooling.
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps)"
    groups:
      web:
        dependency-type: production
        patterns: ["*"]
      web-dev:
        dependency-type: development
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Odd Node majors are not LTS; bump LTS majors manually.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "fix(deps)"
