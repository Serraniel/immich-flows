version: "2"
run:
  build-tags: [e2e]
linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    gosec:
      excludes:
        # MD5/SHA-1 identify files (Immich uses SHA-1 checksums); not used for security.
        - G401
        - G501
        - G505
formatters:
  enable:
    - gofmt
    - goimports
